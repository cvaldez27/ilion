# Configuración para que Spring Boot use H2 en memoria durante los tests
spring.datasource.url=jdbc:h2:mem:ilion_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Le dice a Hibernate que cree las tablas automáticamente basadas en tus @Entity
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect