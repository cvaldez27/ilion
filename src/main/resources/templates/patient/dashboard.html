<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>ÍLION — Dashboard Paciente</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        :root{
            --purple-dark:#55649e; --purple:#787fb0;
            --mint:#94c2b2; --light:#b2d9d7;
            --bg:#ffffff; --pageBg:#f5f5f0;
            --muted:#9a9dc4; --variante-muted:#bcbdd9; --w:#ffffff; --k:#000000;
            --f:'Poppins','Inter',sans-serif;
            --lift:-5px;
            --ease:cubic-bezier(.34,1.56,.64,1);
            --dur:220ms;
        }
        *{box-sizing:border-box;margin:0;padding:0}
        body{font-family:var(--f);background:var(--bg);color:var(--k);min-height:100vh}
        /* Navbar */
        nav{height:40px;display:flex;align-items:flex-end;padding:0 4px;background:#bbb;gap:3px}
        .tab{
            padding:0 24px;height:36px;font-size:13px;font-family:var(--f);
            cursor:pointer;border:none;border-radius:7px 7px 0 0;
            display:flex;align-items:center;gap:5px;font-weight:400;
            transform:translateY(0);will-change:transform;
            transition:transform var(--dur) var(--ease), box-shadow var(--dur) ease;
        }
        .tab:hover{transform:translateY(var(--lift));box-shadow:0 4px 12px rgba(0,0,0,.13)}
        .tab.active{transform:translateY(var(--lift));box-shadow:0 5px 14px rgba(0,0,0,.16);font-weight:600}
        .t-home{background:var(--purple-dark);color:var(--w)}
        .t-appt{background:var(--mint);color:var(--w)}
        .t-med{background:var(--light);color:var(--w)}
        .t-perf{background:var(--purple);color:var(--w)}
        /* Page bar */
        .pbar{background:var(--mint);padding:13px 26px;display:flex;align-items:center;justify-content:space-between}
        .pbar h1{font-size:26px;font-weight:400;color:var(--w)}
        .btn-out{background:var(--purple);border:none;color:var(--w);border-radius:20px;
            padding:6px 16px;font-size:12px;font-family:var(--f);cursor:pointer;transition:background .2s}
        .btn-out:hover{background:var(--purple-dark)}
        /* Content */
        .container{padding:28px 26px}
        .apill{display:inline-block;background:var(--light);color:var(--w);
            font-size:13px;padding:9px 22px;border-radius:20px;margin-bottom:16px}
        .atable{border-collapse:collapse;font-size:12px;width:auto;min-width:380px}
        .atable th{background:#e8e8e8;padding:8px 12px;font-weight:600;font-size:11.5px;
            color:#444;text-align:left;border:1px solid #ccc}
        .atable td{padding:8px 12px;border:1px solid #ddd;color:#333;
            vertical-align:top;background:var(--w);height:52px}
        .atable tr:hover td{background:#f9f9f9}
        .sok{color:#4a8a6a;font-weight:600}
        .spend{color:#b07830;font-weight:600}
        .scancel{color:#c05621;font-weight:600}
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav>
        <div class="tab t-home active" data-sec="home">🏠 Home</div>
        <div class="tab t-appt" data-sec="appointments">Appointments</div>
        <div class="tab t-med" data-sec="medications">Medications</div>
        <div class="tab t-perf" data-sec="profile">Profile</div>
    </nav>
    
    <!-- Page bar -->
    <div class="pbar">
        <h1 th:text="'Welcome, ' + ${#strings.substringBefore(username, '@')}">Welcome, Patient</h1>
        <button id="btnOut" class="btn-out">Log out</button>
    </div>
    
    <!-- Main content -->
    <div class="container">
        <div class="hleft">
            <div class="apill">My upcoming appointments</div>
            <table class="atable">
                <thead>
                    <tr>
                        <th>Hour</th>
                        <th>Day</th>
                        <th>Month</th>
                        <th>Year</th>
                        <th>Doctor</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${appointments.empty}">
                        <td colspan="6" class="no-appointments">No upcoming appointments</td>
                    </tr>
                    <tr th:each="appointment : ${appointments}">
                        <td th:text="${#temporals.format(appointment.time, 'HH:mm')}">10:00</td>
                        <td th:text="${#temporals.format(appointment.date, 'EEEE')}">Monday</td>
                        <td th:text="${#temporals.format(appointment.date, 'MMMM')}">February</td>
                        <td th:text="${#temporals.format(appointment.date, 'yyyy')}">2026</td>
                        <td th:text="${appointment.doctor.name + ' ' + appointment.doctor.lastName}">Dr. Elida Ríos</td>
                        <td th:class="${appointment.status == 'CONFIRMED' ? 'sok' : (appointment.status == 'PENDING' ? 'spend' : 'scancel')}"
                            th:text="${appointment.statusLabel}">Confirmed</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script th:inline="javascript">
        document.getElementById('btnOut').addEventListener('click', function() {
            window.location.href = '/logout';
        });
    </script>
</body>
</html>
</html>
