<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ÍLION — Dashboard Paciente</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/patient/css/dashboard.css}">
</head>
<body>

<!-- Navbar -->
<nav>
    <div class="tab t-home active" data-sec="home">🏠 Home</div>
    <div class="tab t-arch" data-sec="archives">Archives</div>
    <div class="tab t-perf" data-sec="perfil">Perfil</div>
</nav>

<!-- Page bar -->
<div class="pbar">

    <h1
        id="pageTitle"
        th:text="${patient != null} ? 'Welcome, ' + patient.name : 'Welcome, Patient'">
        Welcome, Patient
    </h1>

    <form th:action="@{/logout}" method="post" style="display:inline;">
        <button type="submit" class="btn-out">
            💨 Log out
        </button>
    </form>

</div>

<!-- =========================
     HOME
========================= -->
<section id="sec-home" class="msec active">

    <div class="hlayout">

        <div class="hleft">

            <div class="apill">
                Appointments
            </div>

            <table class="atable">

                <thead>
                    <tr>
                        <th>Hour</th>
                        <th>Day</th>
                        <th>Month</th>
                        <th>Year</th>
                        <th>Doctor</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody>

                    <tr th:each="cita : ${appointments}">

                        <td th:text="${cita.hour}">—</td>

                        <td th:text="${cita.dayOfWeek}">—</td>

                        <td th:text="${cita.month}">—</td>

                        <td th:text="${cita.year}">—</td>

                        <td th:text="${cita.doctor.fullName}">—</td>

                        <td
                            th:class="${cita.status == 'CONFIRMED'} ? 'sok' :
                                      (${cita.status == 'PENDING'} ? 'spend' : 'scancel')"
                            th:text="${cita.status}">
                            —
                        </td>

                        <td>
                            <form th:if="${cita.status.name() == 'PENDING'}"
                                  th:action="@{/patient/appointment/{id}/confirm(id=${cita.id})}"
                                  method="post"
                                  style="display:inline;">
                                <button type="submit" class="small-btn confirm-btn">
                                    Confirm
                                </button>
                            </form>

                            <form th:if="${cita.status.name() == 'PENDING'}"
                                  th:action="@{/patient/appointment/{id}/cancel(id=${cita.id})}"
                                  method="post"
                                  style="display:inline;">
                                <button type="submit" class="small-btn cancel-btn">
                                    Cancel
                                </button>
                            </form>

                            <span th:if="${cita.status.name() != 'PENDING'}">—</span>
                        </td>

                    </tr>

                    <tr th:if="${appointments == null or appointments.isEmpty()}">
                        <td colspan="7"
                            style="text-align:center;padding:20px;color:#999;">
                            No appointments assigned
                        </td>
                    </tr>

                </tbody>

            </table>

        </div>

    </div>

</section>

<!-- =========================
     ARCHIVES
========================= -->
<section id="sec-archives" class="msec">
    <div class="ph">
        Archives section — Coming soon
    </div>
</section>

<!-- =========================
     PROFILE
========================= -->
<section id="sec-perfil" class="msec">
    <div class="ph">
        Profile section — Coming soon
    </div>
</section>

<!-- =========================
     TOAST
========================= -->

<div class="toast" id="toast"></div>

<script th:src="@{/patient/js/dashboard.js}"></script>

</body>
</html>
