spring:
  application:
    name: ilion
  datasource:
    url: jdbc:sqlserver://srv-ilion-prod.database.windows.net:1433;database=ilion-db;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30;
    username: admin_ilion
    password: ${DB_PASSWORD}  # <--- Usa el nombre exacto de la variable en Azure
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.SQLServerDialect
    show-sql: false
  thymeleaf:
    cache: true